<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quoridor 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090a0f;
      color: #f3f4f6;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* PANTALLA DE INICIO */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e2640 0%, #090a0f 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .game-logo-badge {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      padding: 3px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(79, 172, 254, 0.4);
    }

    .logo-inner {
      background: #0f172a;
      padding: 20px 40px;
      border-radius: 21px;
    }

    h1.game-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #38bdf8;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .mode-selection {
      display: flex;
      gap: 16px;
      margin: 30px 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-mode {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: #94a3b8;
      padding: 16px 24px;
      font-size: 1.1rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 160px;
    }

    .btn-mode span {
      font-size: 0.8rem;
      font-weight: 500;
      color: #64748b;
      margin-top: 6px;
    }

    .btn-mode:hover, .btn-mode.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
      color: #ffffff;
      border-color: #38bdf8;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
    }

    .btn-mode.active span {
      color: #38bdf8;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.7);
    }

    /* ENCABEZADO SUPERIOR */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #turn-indicator {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    /* CONTENEDOR 3D */
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* PANEL INFERIOR Y CONTROLES */
    #ui-panel {
      padding: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    .players-cards-container {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      justify-content: center;
    }

    .player-card {
      flex: 1;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
    }

    .player-card.active-p {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .p-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .p-barriers {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
    }

    .controls-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 12px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .ctrl-btn:hover {
      background: rgba(51, 65, 85, 0.9);
      color: #ffffff;
    }

    .ctrl-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* VENTANA VICTORIA */
    #win-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #win-modal.active {
      display: flex;
    }

    .win-box {
      background: #0f172a;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
      max-width: 90%;
      width: 400px;
    }

    .win-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #10b981;
      margin-bottom: 12px;
    }

    .win-msg {
      font-size: 1.1rem;
      margin-bottom: 24px;
      color: #e2e8f0;
      font-weight: 600;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- PANTALLA INICIAL -->
  <div id="start-screen">
    <div class="game-logo-badge">
      <div class="logo-inner">
        <h1 class="game-title">QUORIDOR</h1>
        <p class="subtitle">Estrategia 3D</p>
      </div>
    </div>

    <div class="mode-selection">
      <div class="btn-mode active" id="mode-2p" onclick="selectGameMode(2)">
        2 JUGADORES
        <span>10 Muros cada uno</span>
      </div>
      <div class="btn-mode" id="mode-4p" onclick="selectGameMode(4)">
        4 JUGADORES
        <span>5 Muros cada uno</span>
      </div>
    </div>

    <button class="btn-start" onclick="startGame()">¡INICIAR PARTIDA!</button>
  </div>

  <!-- ENCABEZADO SUPERIOR -->
  <div id="header">
    <div class="header-title">QUORIDOR 3D</div>
    <div id="turn-indicator">
      <div class="turn-dot" id="turn-dot"></div>
      <span id="turn-text">Turno: Jugador 1</span>
    </div>
  </div>

  <!-- CONTENEDOR DE JUEGO 3D -->
  <div id="canvas-container"></div>

  <!-- PANEL DE CONTROLES INFERIOR -->
  <div id="ui-panel">
    <div class="players-cards-container" id="barriers-container"></div>

    <div class="controls-group">
      <button class="ctrl-btn active" id="btn-move" onclick="setActionMode('move')">
        🏃 Mover
      </button>
      <button class="ctrl-btn" id="btn-wall-h" onclick="setActionMode('wall-h')">
        ▬ Muro Horiz.
      </button>
      <button class="ctrl-btn" id="btn-wall-v" onclick="setActionMode('wall-v')">
        ▮ Muro Vert.
      </button>
    </div>
  </div>

  <!-- POPUP VICTORIA -->
  <div id="win-modal">
    <canvas id="confetti-canvas"></canvas>
    <div class="win-box">
      <div class="win-title">🏆 ¡VICTORIA!</div>
      <div class="win-msg" id="win-message">¡El Jugador 1 ha ganado!</div>
      <button class="btn-start" onclick="resetGame()">Volver a Jugar</button>
    </div>
  </div>

  <script>
    /* --- SINTETIZADOR DE AUDIO --- */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'move') {
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'wall') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.linearRampToValueAtTime(85, now + 0.22);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      }
    }

    function playVictoryMelody() {
      if (!audioCtx) return;
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const startTime = audioCtx.currentTime + index * 0.1;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.25, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
        osc.start(startTime);
        osc.stop(startTime + 0.35);
      });
    }

    /* --- CONFIGURACIÓN Y ESTADO DE JUEGO --- */
    let numPlayers = 2;
    let currentPlayer = 0;
    let actionModes = 'move';
    let players = [];
    let placedWalls = [];
    
    const PLAYER_COLORS = [
      { name: 'Jugador 1', hex: 0x10b981, css: '#10b981' },
      { name: 'Jugador 2', hex: 0xef4444, css: '#ef4444' },
      { name: 'Jugador 3', hex: 0x3b82f6, css: '#3b82f6' },
      { name: 'Jugador 4', hex: 0xf59e0b, css: '#f59e0b' }
    ];

    function selectGameMode(mode) {
      numPlayers = mode;
      document.getElementById('mode-2p').classList.toggle('active', mode === 2);
      document.getElementById('mode-4p').classList.toggle('active', mode === 4);
    }

    /* --- MOTOR 3D (THREE.JS) --- */
    let scene, camera, renderer, controls;
    let boardGroup, pawnsGroup, wallsGroup, ghostMesh;
    const BOARD_SIZE = 9;
    const CELL_SIZE = 1.0;
    const GAP = 0.2;
    const STEP = CELL_SIZE + GAP;
    const OFFSET = (BOARD_SIZE - 1) * STEP / 2;

    function init3D() {
      const container = document.getElementById('canvas-container');
      container.innerHTML = '';

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090a0f);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 12, 11);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.15;

      // Iluminación
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(8, 18, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      scene.add(dirLight);

      // Grupos
      boardGroup = new THREE.Group();
      pawnsGroup = new THREE.Group();
      wallsGroup = new THREE.Group();
      scene.add(boardGroup);
      scene.add(pawnsGroup);
      scene.add(wallsGroup);

      createBoard3D();
      createGhostMesh();

      window.addEventListener('resize', onWindowResize);
      setupRaycaster();
      animate();
    }

    function createBoard3D() {
      const baseGeo = new THREE.BoxGeometry(11, 0.4, 11);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = -0.25;
      base.receiveShadow = true;
      boardGroup.add(base);

      const cellGeo = new THREE.BoxGeometry(CELL_SIZE, 0.1, CELL_SIZE);
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cellMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
          const cell = new THREE.Mesh(cellGeo, cellMat);
          cell.position.set(c * STEP - OFFSET, 0, r * STEP - OFFSET);
          cell.receiveShadow = true;
          cell.userData = { r, c, type: 'cell' };
          boardGroup.add(cell);
        }
      }
    }

    function createGhostMesh() {
      const geo = new THREE.BoxGeometry(CELL_SIZE * 2 + GAP, 0.35, 0.15);
      const mat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.5 });
      ghostMesh = new THREE.Mesh(geo, mat);
      ghostMesh.visible = false;
      scene.add(ghostMesh);
    }

    /* --- LÓGICA Y REGLAS DE JUEGO --- */
    function startGame() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';

      const initialBarriers = numPlayers === 2 ? 10 : 5;
      
      if (numPlayers === 2) {
        players = [
          { id: 0, r: 8, c: 4, targetRow: 0, barriers: initialBarriers },
          { id: 1, r: 0, c: 4, targetRow: 8, barriers: initialBarriers }
        ];
      } else {
        players = [
          { id: 0, r: 8, c: 4, targetRow: 0, barriers: initialBarriers },
          { id: 1, r: 0, c: 4, targetRow: 8, barriers: initialBarriers },
          { id: 2, r: 4, c: 0, targetCol: 8, barriers: initialBarriers },
          { id: 3, r: 4, c: 8, targetCol: 0, barriers: initialBarriers }
        ];
      }

      currentPlayer = 0;
      placedWalls = [];

      init3D();
      renderPawns();
      updateUI();
    }

    function renderPawns() {
      while (pawnsGroup.children.length > 0) pawnsGroup.remove(pawnsGroup.children[0]);

      players.forEach((p, idx) => {
        const geo = new THREE.CylinderGeometry(0.3, 0.38, 0.75, 16);
        const mat = new THREE.MeshStandardMaterial({ color: PLAYER_COLORS[idx].hex, roughness: 0.3 });
        const pawn = new THREE.Mesh(geo, mat);
        pawn.position.set(p.c * STEP - OFFSET, 0.4, p.r * STEP - OFFSET);
        pawn.castShadow = true;
        pawnsGroup.add(pawn);
      });
    }

    function isWallAt(r, c, type) {
      return placedWalls.some(w => w.r === r && w.c === c && w.type === type);
    }

    function isBlocked(r1, c1, r2, c2) {
      if (r1 === r2) { // Horizontal
        const minC = Math.min(c1, c2);
        if (isWallAt(r1, minC, 'v') || isWallAt(r1 - 1, minC, 'v')) return true;
      } else if (c1 === c2) { // Vertical
        const minR = Math.min(r1, r2);
        if (isWallAt(minR, c1, 'h') || isWallAt(minR, c1 - 1, 'h')) return true;
      }
      return false;
    }

    function getValidMoves(p) {
      const moves = [];
      const dirs = [
        { r: -1, c: 0 }, { r: 1, c: 0 },
        { r: 0, c: -1 }, { r: 0, c: 1 }
      ];

      dirs.forEach(d => {
        const nr = p.r + d.r;
        const nc = p.c + d.c;

        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
          if (!isBlocked(p.r, p.c, nr, nc)) {
            const opponent = players.find(other => other.r === nr && other.c === nc);
            if (!opponent) {
              moves.push({ r: nr, c: nc });
            } else {
              // Salto simple
              const jumpR = nr + d.r;
              const jumpC = nc + d.c;

              if (jumpR >= 0 && jumpR < BOARD_SIZE && jumpC >= 0 && jumpC < BOARD_SIZE &&
                  !isBlocked(nr, nc, jumpR, jumpC) &&
                  !players.some(other => other.r === jumpR && other.c === jumpC)) {
                moves.push({ r: jumpR, c: jumpC });
              } else {
                // Salto diagonal si está bloqueado por muro
                const diagDirs = d.r !== 0 
                  ? [{ r: 0, c: -1 }, { r: 0, c: 1 }] 
                  : [{ r: -1, c: 0 }, { r: 1, c: 0 }];

                diagDirs.forEach(dd => {
                  const diagR = nr + dd.r;
                  const diagC = nc + dd.c;
                  if (diagR >= 0 && diagR < BOARD_SIZE && diagC >= 0 && diagC < BOARD_SIZE &&
                      !isBlocked(nr, nc, diagR, diagC) &&
                      !players.some(other => other.r === diagR && other.c === diagC)) {
                    moves.push({ r: diagR, c: diagC });
                  }
                });
              }
            }
          }
        }
      });

      return moves;
    }

    function hasPath(player) {
      const queue = [{ r: player.r, c: player.c }];
      const visited = new Set();
      visited.add(`${player.r},${player.c}`);

      while (queue.length > 0) {
        const curr = queue.shift();

        if (player.targetRow !== undefined && curr.r === player.targetRow) return true;
        if (player.targetCol !== undefined && curr.c === player.targetCol) return true;

        const dirs = [
          { r: -1, c: 0 }, { r: 1, c: 0 },
          { r: 0, c: -1 }, { r: 0, c: 1 }
        ];

        for (let d of dirs) {
          const nr = curr.r + d.r;
          const nc = curr.c + d.c;

          if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
            if (!visited.has(`${nr},${nc}`) && !isBlocked(curr.r, curr.c, nr, nc)) {
              visited.add(`${nr},${nc}`);
              queue.push({ r: nr, c: nc });
            }
          }
        }
      }
      return false;
    }

    function canPlaceWall(r, c, type) {
      if (r < 0 || r >= 8 || c < 0 || c >= 8) return false;

      // Impedir cruce directo en la misma intersección
      if (isWallAt(r, c, 'h') || isWallAt(r, c, 'v')) return false;

      // Impedir solapamiento longitudinal
      if (type === 'h' && (isWallAt(r, c - 1, 'h') || isWallAt(r, c + 1, 'h'))) return false;
      if (type === 'v' && (isWallAt(r - 1, c, 'v') || isWallAt(r + 1, c, 'v'))) return false;

      // Validar si encierra a algún peón
      placedWalls.push({ r, c, type });
      const valid = players.every(p => hasPath(p));
      placedWalls.pop();

      return valid;
    }

    /* --- RAYCASTING E INTERACCIÓN --- */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function setupRaycaster() {
      const container = document.getElementById('canvas-container');

      container.addEventListener('pointermove', (e) => {
        if (actionModes === 'move') {
          ghostMesh.visible = false;
          return;
        }

        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const target = new THREE.Vector3();

        if (raycaster.ray.intersectPlane(plane, target)) {
          const c = Math.floor((target.x + OFFSET + STEP / 2) / STEP);
          const r = Math.floor((target.z + OFFSET + STEP / 2) / STEP);

          if (r >= 0 && r < 8 && c >= 0 && c < 8) {
            const type = actionModes === 'wall-h' ? 'h' : 'v';
            const isValid = canPlaceWall(r, c, type);

            ghostMesh.rotation.y = type === 'v' ? Math.PI / 2 : 0;
            ghostMesh.position.set((c * STEP - OFFSET) + STEP / 2, 0.2, (r * STEP - OFFSET) + STEP / 2);
            ghostMesh.material.color.setHex(isValid ? 0x10b981 : 0xef4444);
            ghostMesh.visible = true;
          } else {
            ghostMesh.visible = false;
          }
        }
      });

      container.addEventListener('pointerdown', (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        if (actionModes === 'move') {
          const intersects = raycaster.intersectObjects(boardGroup.children);
          if (intersects.length > 0) {
            const data = intersects[0].object.userData;
            if (data && data.type === 'cell') {
              tryMovePawn(data.r, data.c);
            }
          }
        } else {
          const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
          const target = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(plane, target)) {
            const c = Math.floor((target.x + OFFSET + STEP / 2) / STEP);
            const r = Math.floor((target.z + OFFSET + STEP / 2) / STEP);
            
            if (r >= 0 && r < 8 && c >= 0 && c < 8) {
              const type = actionModes === 'wall-h' ? 'h' : 'v';
              tryPlaceWall(r, c, type);
            }
          }
        }
      });
    }

    function tryMovePawn(r, c) {
      const p = players[currentPlayer];
      const validMoves = getValidMoves(p);

      const isValid = validMoves.some(m => m.r === r && m.c === c);

      if (isValid) {
        p.r = r;
        p.c = c;
        playSound('move');
        renderPawns();
        checkWinCondition();
        nextTurn();
      } else {
        playSound('error');
      }
    }

    function tryPlaceWall(r, c, type) {
      const p = players[currentPlayer];
      if (p.barriers <= 0) {
        playSound('error');
        return;
      }

      if (canPlaceWall(r, c, type)) {
        placedWalls.push({ r, c, type });
        p.barriers--;
        playSound('wall');
        addWallMesh(r, c, type);
        ghostMesh.visible = false;
        nextTurn();
      } else {
        playSound('error');
      }
    }

    function addWallMesh(r, c, type) {
      const geo = type === 'h' 
        ? new THREE.BoxGeometry(CELL_SIZE * 2 + GAP, 0.35, 0.15)
        : new THREE.BoxGeometry(0.15, 0.35, CELL_SIZE * 2 + GAP);
      
      const mat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
      const wall = new THREE.Mesh(geo, mat);

      const posX = (c * STEP - OFFSET) + STEP / 2;
      const posZ = (r * STEP - OFFSET) + STEP / 2;

      wall.position.set(posX, 0.2, posZ);
      wall.castShadow = true;
      wallsGroup.add(wall);
    }

    function nextTurn() {
      currentPlayer = (currentPlayer + 1) % numPlayers;
      setActionMode('move');
      updateUI();
    }

    function checkWinCondition() {
      const p = players[currentPlayer];
      let won = false;

      if (p.targetRow !== undefined && p.r === p.targetRow) won = true;
      if (p.targetCol !== undefined && p.c === p.targetCol) won = true;

      if (won) {
        playVictoryMelody();
        document.getElementById('win-message').innerText = `¡El ${PLAYER_COLORS[currentPlayer].name} ha ganado la partida!`;
        document.getElementById('win-modal').classList.add('active');
        startConfetti();
      }
    }

    /* --- ACTUALIZACIÓN DE INTERFAZ --- */
    function setActionMode(mode) {
      actionModes = mode;
      document.getElementById('btn-move').classList.toggle('active', mode === 'move');
      document.getElementById('btn-wall-h').classList.toggle('active', mode === 'wall-h');
      document.getElementById('btn-wall-v').classList.toggle('active', mode === 'wall-v');
      if (ghostMesh) ghostMesh.visible = false;
    }

    function updateUI() {
      const turnText = document.getElementById('turn-text');
      const turnDot = document.getElementById('turn-dot');
      
      turnText.innerText = `Turno: ${PLAYER_COLORS[currentPlayer].name}`;
      turnText.style.color = PLAYER_COLORS[currentPlayer].css;
      turnDot.style.backgroundColor = PLAYER_COLORS[currentPlayer].css;
      turnDot.style.color = PLAYER_COLORS[currentPlayer].css;

      const container = document.getElementById('barriers-container');
      container.innerHTML = '';

      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === currentPlayer ? 'active-p' : ''}`;
        card.innerHTML = `
          <div class="p-name" style="color:${PLAYER_COLORS[idx].css}">J${idx + 1}</div>
          <div class="p-barriers">${p.barriers} Muros</div>
        `;
        container.appendChild(card);
      });
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function resetGame() {
      document.getElementById('win-modal').classList.remove('active');
      document.getElementById('start-screen').style.display = 'flex';
    }

    /* --- CONFETI --- */
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 8 + 4,
        color: ['#10b981', '#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6'][Math.floor(Math.random() * 5)],
        speed: Math.random() * 3 + 2
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          p.y += p.speed;
          if (p.y > canvas.height) p.y = -10;
        });
        if (document.getElementById('win-modal').classList.contains('active')) {
          requestAnimationFrame(draw);
        }
      }
      draw();
    }
  </script>
</body>
